<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Cloud Notify | Admin Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f6f8fc;
            color: #1e293b;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --primary: #1e40af;
            --primary-light: #2563eb;
            --primary-soft: #eff6ff;
            --accent: #0f172a;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --success: #059669;
            --success-bg: #ecfdf5;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --warning: #d97706;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05);
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-lg: 20px;
        }

        #app {
            min-height: 100vh;
        }

        .auth-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(125deg, #f0f4fe 0%, #e9eef8 100%);
            padding: 1.5rem;
        }

        .auth-card {
            background: rgba(255,255,255,0.96);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.02);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .auth-card h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .tab-group {
            display: flex;
            gap: 0.5rem;
            background: var(--gray-100);
            padding: 0.3rem;
            border-radius: 60px;
            margin-bottom: 2rem;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.6rem 0;
            font-weight: 500;
            font-size: 0.9rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--gray-600);
            font-family: inherit;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--gray-600);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
            background: white;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            color: var(--gray-700);
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow-xs);
        }
        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--gray-200);
        }
        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .btn-sm {
            padding: 0.4rem 0.9rem;
            font-size: 0.75rem;
        }
        .error-message {
            font-size: 0.75rem;
            color: var(--danger);
            margin-top: 0.5rem;
            min-height: 1.2rem;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #f6f8fc;
        }
        .top-bar {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 0 2rem;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.92);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
            color: var(--primary);
        }
        .logo-icon {
            font-size: 1.6rem;
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        .user-badge {
            background: var(--gray-100);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--gray-700);
        }
        .dashboard-layout {
            display: flex;
            flex: 1;
        }
        .sidebar-nav {
            width: 260px;
            background: white;
            border-right: 1px solid var(--gray-200);
            padding: 1.8rem 1rem;
            height: calc(100vh - 70px);
            position: sticky;
            top: 70px;
            overflow-y: auto;
        }
        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .nav-item:hover {
            background: var(--gray-50);
            color: var(--primary);
        }
        .nav-item.active {
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
        }
        .main-panel {
            flex: 1;
            padding: 2rem;
            overflow-x: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .main-panel > *:not(:last-child) {
            margin-bottom: 0;
        }
        .page-header {
            margin-bottom: 2.2rem;
        }
        .page-header h2 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--gray-800);
        }
        .card-modern {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-sm);
        }
        .card-modern + .card-modern {
            margin-top: 2.5rem;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.8rem;
            margin-top: 1.5rem;
        }
        .stat-item {
            background: var(--gray-50);
            border-radius: var(--radius-md);
            padding: 1.2rem;
            border: 1px solid var(--gray-200);
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }
        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--gray-100);
            color: var(--gray-600);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status-chip i {
            font-size: 1rem;
        }
        .connected-status {
            background: var(--success-bg);
            color: var(--success);
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--gray-200);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            text-align: left;
            padding: 1rem;
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 1px solid var(--gray-200);
        }
        td {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid var(--gray-100);
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-success {
            background: var(--success-bg);
            color: var(--success);
        }
        .badge-danger {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .method-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem;
            border-bottom: 1px solid var(--gray-200);
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        .method-row:last-child {
            border-bottom: none;
        }
        .toggle {
            width: 44px;
            height: 24px;
            background: var(--gray-300);
            border-radius: 60px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle.active {
            background: var(--success);
        }
        .toggle-circle {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }
        .toggle.active .toggle-circle {
            left: 22px;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .text-muted { color: var(--gray-600); font-size: 0.8rem; }
        .doc-section {
            margin-bottom: 2.5rem;
        }
        .doc-section h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .doc-subsection {
            margin-left: 1rem;
            margin-bottom: 1.5rem;
        }
        .doc-subsection h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.7rem;
            color: var(--gray-800);
        }
        .code-block {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-md);
            padding: 1rem;
            overflow-x: auto;
            margin: 0.8rem 0;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .code-block code {
            color: var(--primary);
        }
        .endpoint-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .endpoint-get { background: #d1fae5; color: #065f46; }
        .endpoint-post { background: #dbeafe; color: #1e40af; }
        .endpoint-put { background: #fef3c7; color: #92400e; }
        .endpoint-delete { background: #fee2e2; color: #991b1b; }
        .param-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .param-table th, .param-table td {
            text-align: left;
            padding: 0.8rem;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.9rem;
        }
        .param-table th {
            background: var(--primary-soft);
            font-weight: 600;
            color: var(--primary);
        }
        .param-table tr:hover {
            background: var(--gray-50);
        }
        .example-box {
            background: var(--gray-50);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin: 1rem 0;
        }
        .tip-box {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin: 1rem 0;
        }
        .warning-box {
            background: #fef2f2;
            border-left: 4px solid var(--danger);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin: 1rem 0;
        }
        @media (max-width: 780px) {
            .sidebar-nav { width: 80px; }
            .main-panel { padding: 1.5rem; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="auth-section" class="auth-section">
        <div class="auth-card">
            <h1>cloud<span style="font-weight:400"> notify</span></h1>
            <div class="tab-group">
                <button class="tab-btn active" data-tab="login">Sign in</button>
                <button class="tab-btn" data-tab="register">Create account</button>
            </div>
            <div id="login-pane" class="tab-pane active">
                <form id="login-form">
                    <div class="form-group"><label>Username</label><input type="text" id="login-username" placeholder="johndoe" autocomplete="off"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="••••••"></div>
                    <button type="submit" class="btn btn-primary" style="width:100%">Sign in →</button>
                    <div id="login-error" class="error-message"></div>
                </form>
            </div>
            <div id="register-pane" class="tab-pane" style="display:none">
                <form id="register-form">
                    <div class="form-group"><label>Username</label><input type="text" id="reg-username"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="reg-email"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="reg-password"></div>
                    <button type="submit" class="btn btn-primary" style="width:100%">Register →</button>
                    <div id="register-error" class="error-message"></div>
                </form>
            </div>
        </div>
    </div>

    <div id="dashboard-section" style="display:none">
        <div class="dashboard">
            <div class="top-bar">
                <div class="logo-area"><i class="fas fa-cloud"></i> Cloud Notify</div>
                <div class="user-area"><span id="user-info" class="user-badge"></span><button id="logout-btn" class="btn btn-outline btn-sm">Exit</button></div>
            </div>
            <div class="dashboard-layout">
                <aside class="sidebar-nav">
                    <div class="nav-items">
                        <button class="nav-item active" data-dash="overview"><i class="fas fa-chart-line"></i> Overview</button>
                        <button class="nav-item" data-dash="api-keys"><i class="fas fa-key"></i> API Keys</button>
                        <button class="nav-item" data-dash="credentials"><i class="fas fa-lock"></i> Credentials</button>
                        <button class="nav-item" data-dash="notifications"><i class="fas fa-bell"></i> Methods</button>
                        <button class="nav-item" data-dash="test"><i class="fas fa-flask"></i> Test</button>
                        <button class="nav-item" data-dash="users"><i class="fas fa-users"></i> Users</button>
                        <button class="nav-item" data-dash="docs"><i class="fas fa-book"></i> Docs</button>
                    </div>
                </aside>
                <main class="main-panel" id="dashboard-main"></main>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api/admin';
    let authToken = localStorage.getItem('authToken') || null;
    let currentUser = { username: '' };

    async function apiCall(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
        const res = await fetch(`${API_BASE}${endpoint}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
    }

    function showToast(msg, isError = false) {
        Swal.fire({
            icon: isError ? 'error' : 'success',
            title: msg,
            toast: true,
            position: 'bottom-end',
            showConfirmButton: false,
            timer: 2800
        });
    }

    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        try {
            const res = await fetch(`${API_BASE}/auth/login`, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username,password}) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Login failed');
            authToken = data.token;
            localStorage.setItem('authToken', authToken);
            currentUser = { id: data.userId, username };
            showDashboardUI();
        } catch(err) { 
            Swal.fire('Login Error', err.message, 'error');
        }
    }

    async function handleRegister(e) {
        e.preventDefault();
        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        try {
            const res = await fetch(`${API_BASE}/auth/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username,email,password}) });
            const data = await res.json();
            if(!res.ok) throw new Error(data.error);
            authToken = data.token;
            localStorage.setItem('authToken', authToken);
            currentUser = { id: data.userId, username };
            showDashboardUI();
        } catch(err) { 
            Swal.fire('Registration Error', err.message, 'error');
        }
    }

    function logout() { 
        authToken = null; 
        localStorage.removeItem('authToken'); 
        document.getElementById('auth-section').style.display = 'flex'; 
        document.getElementById('dashboard-section').style.display = 'none'; 
    }

    function removeTestDevice(index) {
        let devices = JSON.parse(localStorage.getItem('testDevices') || '[]');
        const deviceName = devices[index]?.name || 'Device';
        
        Swal.fire({
            title: 'Remove Device?',
            text: `Are you sure you want to remove "${deviceName}"?`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc2626',
            confirmButtonText: 'Remove'
        }).then((result) => {
            if (result.isConfirmed) {
                devices.splice(index, 1);
                localStorage.setItem('testDevices', JSON.stringify(devices));
                showToast('Device removed');
                renderDashboardTab('test');
            }
        });
    }

    function getCurrentDeviceToken() {
        // Check if browser supports notifications
        if (!('Notification' in window)) {
            showToast('Your browser does not support web notifications', true);
            return;
        }

        Swal.fire({
            title: 'Browser Push Notification Setup',
            html: `
                <div style="text-align: left;">
                    <p><strong>For Web Push Notifications:</strong></p>
                    <div class="tip-box">
                        <p>To receive push notifications in this browser, you need to integrate Firebase Cloud Messaging (FCM).</p>
                    </div>
                    
                    <p style="margin-top: 1.5rem;"><strong>Options:</strong></p>
                    <ul style="text-align: left; margin: 1rem 0;">
                        <li><strong>Test with Mobile Devices:</strong> Get FCM tokens from your iOS/Android app and register them</li>
                        <li><strong>Set Up FCM for Web:</strong> Integrate Firebase SDK to get a web FCM token</li>
                        <li><strong>Use Demo Token:</strong> Register a demo token for testing (won't receive real notifications)</li>
                    </ul>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'Register Demo Token',
            cancelButtonText: 'Cancel',
            didOpen: () => {
                const html = Swal.getHtmlContainer();
                const demoBtn = html.querySelector('.swal2-confirm');
                demoBtn.innerHTML = 'Register Demo Token';
            }
        }).then((result) => {
            if (result.isConfirmed) {
                registerBrowserDevice();
            }
        });
    }

    function registerBrowserDevice() {
        // Generate unique demo browser ID
        let browserId = localStorage.getItem('browserDeviceId');
        if (!browserId) {
            browserId = 'demo_web_' + crypto.getRandomValues(new Uint8Array(8)).reduce((a, b) => a + b.toString(16), '');
            localStorage.setItem('browserDeviceId', browserId);
        }

        // Get browser info
        const userAgent = navigator.userAgent;
        let browserName = 'Unknown Browser';
        let osName = 'Unknown OS';

        if (userAgent.indexOf('Chrome') > -1 && userAgent.indexOf('Edg') === -1) {
            browserName = 'Chrome';
        } else if (userAgent.indexOf('Safari') > -1 && userAgent.indexOf('Chrome') === -1) {
            browserName = 'Safari';
        } else if (userAgent.indexOf('Firefox') > -1) {
            browserName = 'Firefox';
        } else if (userAgent.indexOf('Edg') > -1) {
            browserName = 'Edge';
        }

        if (userAgent.indexOf('Windows') > -1) {
            osName = 'Windows';
        } else if (userAgent.indexOf('Mac') > -1) {
            osName = 'macOS';
        } else if (userAgent.indexOf('Linux') > -1) {
            osName = 'Linux';
        } else if (userAgent.indexOf('iPhone') > -1 || userAgent.indexOf('iPad') > -1) {
            osName = 'iOS';
        } else if (userAgent.indexOf('Android') > -1) {
            osName = 'Android';
        }

        const deviceName = `${browserName} on ${osName} (Demo)`;

        // Register device
        let devices = JSON.parse(localStorage.getItem('testDevices') || '[]');
        
        // Check if browser already registered
        const existingIndex = devices.findIndex(d => d.token === browserId);
        if (existingIndex !== -1) {
            showToast('This browser is already registered', true);
            return;
        }

        devices.push({
            name: deviceName,
            type: 'Web',

            const content = await dashboardContent[tab]();
            mainEl.innerHTML = content;
            attachDynamicHandlers(tab);
        } catch(e) { mainEl.innerHTML = `<div class="card-modern">Failed to load: ${e.message}</div>`; }
    }

    function attachDynamicHandlers(tab) {
        if (tab === 'api-keys') {
            document.getElementById('newKeyBtn')?.addEventListener('click', () => openKeyModal());
            document.querySelectorAll('.copy-key').forEach(btn => btn.addEventListener('click', () => { navigator.clipboard.writeText(btn.getAttribute('data-key')); showToast('Copied!'); }));
            document.querySelectorAll('.del-key').forEach(btn => btn.addEventListener('click', async () => { 
                const result = await Swal.fire({ title: 'Delete Key?', text: 'This action cannot be undone', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'Delete' });
                if(result.isConfirmed){ await apiCall(`/api-keys/${btn.getAttribute('data-id')}`, 'DELETE'); showToast('Deleted'); renderDashboardTab('api-keys'); } 
            }));
        }
        if (tab === 'credentials') {
            document.getElementById('newCredBtn')?.addEventListener('click', () => openCredModal());
            document.querySelectorAll('.del-cred').forEach(btn => btn.addEventListener('click', async () => { 
                const result = await Swal.fire({ title: 'Delete Credential?', text: 'This action cannot be undone', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'Delete' });
                if(result.isConfirmed){ await apiCall(`/credentials/${btn.getAttribute('data-id')}`, 'DELETE'); showToast('Removed'); renderDashboardTab('credentials'); } 
            }));
        }
        if (tab === 'notifications') {
            document.querySelectorAll('.toggle').forEach(toggle => {
                toggle.addEventListener('click', async () => {
                    const id = toggle.getAttribute('data-id');
                    const newState = !toggle.classList.contains('active');
                    await apiCall(`/notification-methods/${id}`, 'PUT', { isEnabled: newState });
                    showToast(`Method ${newState ? 'enabled' : 'disabled'}`);
                    renderDashboardTab('notifications');
                });
            });
        }
        if (tab === 'test') {
            // Get current device token
            document.getElementById('get-current-device-btn')?.addEventListener('click', getCurrentDeviceToken);
            
            // Device registration
            document.getElementById('register-device-form')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('device-name').value;
                const type = document.getElementById('device-type').value;
                const token = document.getElementById('device-token').value;
                
                if (!name || !type || !token) {
                    showToast('Please fill all device fields', true);
                    return;
                }
                
                let devices = JSON.parse(localStorage.getItem('testDevices') || '[]');
                devices.push({ name, type, token, registeredAt: new Date().toISOString() });
                localStorage.setItem('testDevices', JSON.stringify(devices));
                
                showToast('Device registered successfully!');
                document.getElementById('register-device-form').reset();
                renderDashboardTab('test');
            });
            
            // Test device buttons
            document.querySelectorAll('.test-device-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const index = btn.getAttribute('data-index');
                    const devices = JSON.parse(localStorage.getItem('testDevices') || '[]');
                    const device = devices[index];
                    
                    if (!device) {
                        showToast('Device not found', true);
                        return;
                    }
                    
                    const result = await Swal.fire({
                        title: `Test Push to ${device.name}`,
                        html: `
                            <input type="text" id="push-title" class="swal2-input" placeholder="Notification title" value="Test Notification">
                            <input type="text" id="push-body" class="swal2-input" placeholder="Message body" value="This is a test push notification from Cloud Notify">
                        `,
                        showCancelButton: true,
                        confirmButtonText: 'Send Test',
                        preConfirm: () => {
                            const title = document.getElementById('push-title').value;
                            const body = document.getElementById('push-body').value;
                            if (!title || !body) {
                                Swal.showValidationMessage('Please enter title and message');
                                return false;
                            }
                            return { title, body };
                        }
                    });
                    
                    if (result.isConfirmed) {
                        try {
                            await apiCall('/test-notification', 'POST', {
                                type: 'PUSH',
                                recipient: device.token,
                                title: result.value.title,
                                body: result.value.body
                            });
                            
                            // Show browser notification if it's a web device and this browser
                            if (device.isBrowser && device.token === localStorage.getItem('browserDeviceId')) {
                                if ('Notification' in window && Notification.permission === 'granted') {
                                    new Notification(result.value.title, {
                                        body: result.value.body,
                                        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%231e40af"/><text x="50" y="60" font-size="50" font-weight="bold" fill="white" text-anchor="middle">CN</text></svg>'
                                    });
                                }
                            }
                            
                            showToast(`Test notification sent to ${device.name}`);
                        } catch(err) {
                            showToast(err.message, true);
                        }
                    }
                });
            });
            
            // Send test notification
            document.getElementById('test-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const type = document.getElementById('test-type').value;
                const recipient = document.getElementById('test-recipient').value;
                const title = document.getElementById('test-title').value;
                const body = document.getElementById('test-body').value;
                try {
                    await apiCall('/test-notification', 'POST', { type, recipient, title, body });
                    showToast(`Test ${type} sent successfully`);
                    renderDashboardTab('test');
                } catch(err) { showToast(err.message, true); }
            });
        }
        if (tab === 'users') {
            document.querySelectorAll('.del-user').forEach(btn => btn.addEventListener('click', async () => { 
                const result = await Swal.fire({ title: 'Delete User?', text: 'This action cannot be undone', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'Delete' });
                if(result.isConfirmed){ await apiCall(`/users/${btn.getAttribute('data-id')}`, 'DELETE'); showToast('User deleted'); renderDashboardTab('users'); } 
            }));
        }
    }

    function openKeyModal() {
        Swal.fire({
            title: 'Create New API Key',
            html: `
                <input type="text" id="key-name" class="swal2-input" placeholder="Key name">
                <input type="number" id="key-rate-limit" class="swal2-input" placeholder="Rate limit" value="1000">
                <input type="number" id="key-rate-window" class="swal2-input" placeholder="Window (seconds)" value="3600">
            `,
            showCancelButton: true,
            confirmButtonText: 'Create',
            preConfirm: () => {
                const name = document.getElementById('key-name').value;
                const rateLimit = document.getElementById('key-rate-limit').value;
                const rateLimitWindow = document.getElementById('key-rate-window').value;
                if (!name) {
                    Swal.showValidationMessage('Key name is required');
                    return false;
                }
                return { name, rateLimit: parseInt(rateLimit) || 1000, rateLimitWindow: parseInt(rateLimitWindow) || 3600 };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    const response = await apiCall('/api-keys', 'POST', { name: result.value.name, rateLimit: result.value.rateLimit, rateLimitWindow: result.value.rateLimitWindow });
                    const keyValue = response.key || 'N/A';
                    
                    // Show the generated key for user to copy
                    await Swal.fire({
                        title: 'API Key Created!',
                        html: `
                            <div style="text-align: left; background: #f5f5f5; padding: 1rem; border-radius: 6px; margin: 1rem 0; word-break: break-all;">
                                <strong>Key:</strong><br/>
                                <code style="font-size: 0.9rem; color: #1e40af;">${keyValue}</code>
                            </div>
                            <div style="color: #dc2626; font-weight: 500; margin-top: 1rem;">
                                <i class="fas fa-exclamation-triangle"></i> Save this key somewhere safe. You won't be able to see it again!
                            </div>
                        `,
                        icon: 'success',
                        confirmButtonText: 'Copy & Close',
                        allowOutsideClick: false
                    }).then(() => {
                        navigator.clipboard.writeText(keyValue);
                        showToast('Key copied to clipboard!');
                        renderDashboardTab('api-keys');
                    });
                } catch(e) {
                    showToast(e.message, true);
                }
            }
        });
    }

    function openCredModal() {
        Swal.fire({
            title: 'Add New Credential',
            html: `
                <input type="text" id="cred-key" class="swal2-input" placeholder="Credential key (e.g., TWILIO_SID)" style="margin-bottom:10px;">
                <input type="text" id="cred-value" class="swal2-input" placeholder="Secret value">
            `,
            showCancelButton: true,
            confirmButtonText: 'Add',
            preConfirm: () => {
                const key = document.getElementById('cred-key').value;
                const value = document.getElementById('cred-value').value;
                if (!key || !value) {
                    Swal.showValidationMessage('All fields are required');
                    return false;
                }
                return { key, value };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    await apiCall('/credentials', 'POST', result.value);
                    showToast('Credential added');
                    renderDashboardTab('credentials');
                } catch(e) {
                    showToast(e.message, true);
                }
            }
        });
    }

    function showDashboardUI() {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        document.getElementById('user-info').innerHTML = `<i class="fas fa-user"></i> ${currentUser.username}`;
        document.getElementById('logout-btn').onclick = () => logout();
        const navBtns = document.querySelectorAll('.nav-item');
        navBtns.forEach(btn => {
            btn.addEventListener('click', async () => {
                navBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeDashboard = btn.getAttribute('data-dash');
                await renderDashboardTab(activeDashboard);
            });
        });
        renderDashboardTab('overview');
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            const target = btn.innerText.toLowerCase().includes('sign') ? 'login' : 'register';
            document.getElementById('login-pane').style.display = target === 'login' ? 'block' : 'none';
            document.getElementById('register-pane').style.display = target === 'register' ? 'block' : 'none';
        });
    });
    document.getElementById('login-form').addEventListener('submit', handleLogin);
    document.getElementById('register-form').addEventListener('submit', handleRegister);

    if (authToken) { currentUser.username = 'Admin'; showDashboardUI(); }
    else { document.getElementById('auth-section').style.display = 'flex'; }
</script>
</body>
</html>
