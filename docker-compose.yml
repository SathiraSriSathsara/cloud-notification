version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: cloud-notification-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your-redis-password}
    command: redis-server --requirepass ${REDIS_PASSWORD:-your-redis-password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notification-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-notification-app
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your-redis-password}
      - REDIS_USERNAME=${REDIS_USERNAME:-default}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./firebase-key.json:/app/firebase-key.json
    networks:
      - notification-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  notification-network:
    driver: bridge
